worker_processes 1;
daemon on;
error_log /Users/august/Code/soquel/.nginx/error.log warn;
pid /Users/august/Code/soquel/.nginx/nginx.pid;

events { worker_connections 64; }

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    client_body_temp_path /Users/august/Code/soquel/.nginx/tmp/client;
    proxy_temp_path       /Users/august/Code/soquel/.nginx/tmp/proxy;
    fastcgi_temp_path     /Users/august/Code/soquel/.nginx/tmp/fastcgi;
    uwsgi_temp_path       /Users/august/Code/soquel/.nginx/tmp/uwsgi;
    scgi_temp_path        /Users/august/Code/soquel/.nginx/tmp/scgi;

    sendfile on;
    keepalive_timeout 20;

    server {
        listen 8420;
        server_name _;
        root /Users/august/Code/soquel/status;
        index index.html;
        charset utf-8;

        # Status payload changes constantly — never let a proxy or browser hold it.
        location = /status.json {
            add_header Cache-Control "no-store, must-revalidate";
            expires -1;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
